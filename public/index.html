<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electronicos.com | Asistente</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="encabezado">
<h1 class="marca">Electronicos.com</h1>
<p class="bajada">Asistente de productos</p>
</header>

<div class="contenido">

<main class="chat">

<div class="mensajes" id="mensajes">
<div class="fila fila-asistente">
<div class="burbuja burbuja-asistente">¡Hola! Soy el asistente de Electronicos.com. Te ayudo a elegir el producto que mejor se adapte a lo que necesitas. Cuéntame qué estás buscando y para qué lo vas a usar.</div>
</div>
</div>

<form class="redaccion" id="formulario">
<textarea id="campo-texto" class="campo-texto" rows="1" placeholder="Escribe tu mensaje" autocomplete="off"></textarea>
<button type="submit" id="boton-enviar" class="boton-enviar">Enviar</button>
</form>

</main>

</div>

<script src="app.js"></script>
</body>
</html>
